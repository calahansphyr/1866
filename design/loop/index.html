<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1866 — the loop</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500;600&display=swap">
  <style>
    html, body { margin: 0; background: #241F1B; color: #F3EDE2; font-family: Outfit, sans-serif; }
    main { padding: 36px 32px 64px; }
    .kicker { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #A89880; }
    h1 { margin: 8px 0 0; font-family: Fraunces, Georgia, serif; font-weight: 560; font-size: 42px; letter-spacing: -0.03em; }
    .lead { max-width: 640px; margin: 10px 0 0; font-size: 16px; line-height: 1.45; color: #C9BBA6; }
    .board { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, 300px); gap: 36px 28px; align-items: start; }
    figure { margin: 0; width: 300px; }
    figcaption { margin-bottom: 10px; }
    figcaption b { display: block; font-family: Fraunces, Georgia, serif; font-weight: 560; font-size: 18px; letter-spacing: -0.02em; }
    figcaption span { display: block; margin-top: 4px; font-size: 13px; line-height: 1.4; color: #C9BBA6; }
    .frame { width: 300px; height: 652px; overflow: hidden; border-radius: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
    iframe { width: 390px; height: 844px; border: 0; transform: scale(.769); transform-origin: top left; background: #E4DCCB; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Hollis claim · Season 5 of 20 · Spring into summer 1867</p>
    <h1>The loop</h1>
    <p class="lead">Four screens of one season, one visual system. Same ledger as the other boards: cash $41.50, a $28 tab at 3% a month, cellar three-quarters full. The grade stays off the screen until Christmas.</p>
    <div class="board">
      <figure>
        <figcaption><b>1 · The post</b><span>Sources show their price and their lateness. The note is open on “pens.” Gold is on the page and touches nothing you hold.</span></figcaption>
        <div class="frame"><iframe title="The post" src="../art-directions/Post.dc.html"></iframe></div>
      </figure>
      <figure>
        <figcaption><b>2 · Three visits</b><span>Seven doors, three taps. McCoy is the open visit. The banker will not see you while the tab is this size.</span></figcaption>
        <div class="frame"><iframe title="Three visits" src="../art-directions/Town.dc.html"></iframe></div>
      </figure>
      <figure>
        <figcaption><b>3 · Set the House</b><span>Hay, labor, and cash are sizes, not yes-or-no. Swing is off. The line under the bars is a consequence, not a verdict.</span></figcaption>
        <div class="frame"><iframe title="Set the House" src="../art-directions/Allocation.dc.html"></iframe></div>
      </figure>
      <figure>
        <figcaption><b>4 · The season turns</b><span>A dry month, fully covered by the cellar. The receipt explains the loss. Sound, Unlucky, Lucky, and Exposed are not on this screen.</span></figcaption>
        <div class="frame"><iframe title="The season turns" src="../art-directions/Season.dc.html"></iframe></div>
      </figure>
    </div>
  </main>
</body>
</html>
