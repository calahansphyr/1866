    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px;">
      <div style="display: flex; gap: 14px; align-items: center;">

          <div style="font-family: 'Press Start 2P', monospace; font-size: 7px;">TALK</div>

      <div style="display: flex; gap: 8px;">

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      'TTTTTTTTTTTTT',
      'TRRRgRRRgRRRT',
      'TWDWgWDWgWDWT',
      'gpppppppppppg',
      'gpgggggggggpg',
      'gpgRRRgfffgpg',
      'gpgWDWgfgfgpg',
      'gpppppppppppg',
      'ggggpgggggggg',
      'cccgpgggTgggg',
      'cccgpggggggTg',
      'cccgpgggggggg',
      'wwwwbwwwwwwww',
      'wwwwbwwwwwwww',
      'ggggpgggTgggg'
    ];
    var S = {
      T: 'background:#6BB04A; box-shadow: inset 0 0 0 4px #6BB04A, inset 0 0 0 30px #2F6B3A; border-radius: 0;',
      g: 'background:#6BB04A; box-shadow: inset 6px 6px 0 -4px #7CC25A;',
      p: 'background:#D9B77A; box-shadow: inset 0 -2px 0 #C9A260;',
      R: 'background:#B5483A; box-shadow: inset 0 -6px 0 #7A2E24, inset 0 2px 0 #D86A55;',
      W: 'background:#D9C29A; box-shadow: inset 0 0 0 2px #8A6A4A;',
      D: 'background:#5A3A24; box-shadow: inset 0 0 0 3px #D9C29A;',
      f: 'background:#6BB04A; box-shadow: inset 0 12px 0 -9px #8A5A3A, inset 0 -12px 0 -9px #8A5A3A;',
      c: 'background:repeating-linear-gradient(90deg,#C9A24A 0 5px,#8A6A2A 5px 7px);',
      w: 'background:#3E7FC1; box-shadow: inset 8px 10px 0 -7px #7FB2E2;',
      b: 'background:repeating-linear-gradient(0deg,#9C6B3E 0 5px,#6B4423 5px 6px);'
    };
    var tiles = [];
    rows.forEach(function (r) { for (var i = 0; i < r.length; i++) tiles.push({ st: 'height:30px;' + S[r[i]] }); });
    return { tiles: tiles };
  }
}
</script>
