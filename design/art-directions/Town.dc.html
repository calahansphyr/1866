<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,640&family=Outfit:wght@400;500;600&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>html, body { margin: 0; background: #E4DCCB; } x-dc { display: block; }</style>
</helmet>
<div class="phone">
  <header class="top">
    <div class="brand">
      <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><rect x=".75" y=".75" width="16.5" height="16.5" fill="none" stroke="#1A1714" stroke-width="1.2"/><path d="M9 .8v16.4M.8 9h16.4" stroke="#1A1714" stroke-width=".8"/><rect x="9" y="9" width="8.2" height="8.2" fill="#1E5C40"/></svg>
      <span>Hollis claim</span>
    </div>
    <span class="count">5 / 20</span>
  </header>

  <p class="kicker">A week in town</p>
  <div class="title-row">
    <h1>Three visits</h1>
    <div class="pips" aria-label="Three visits remaining"><i></i><i></i><i></i></div>
  </div>

  <svg class="street" viewBox="0 0 346 168" aria-hidden="true">
    <rect y="136" width="346" height="32" fill="#D4C9B4"/>
    <path d="M0 148h346" stroke="#C4B89F" stroke-width="2"/>
    <g fill="#1A1714">
      <rect x="6" y="78" width="34" height="58"/>
      <rect x="12" y="88" width="8" height="12" fill="#F7F3EA"/><rect x="24" y="88" width="8" height="12" fill="#F7F3EA"/>
      <rect x="16" y="112" width="12" height="24" fill="#E4DCCB"/>
      <rect x="46" y="62" width="42" height="74"/>
      <rect x="56" y="104" width="16" height="32" fill="#F7F3EA"/>
      <rect x="78" y="74" width="8" height="12" fill="#A6843D"/>
      <rect x="96" y="48" width="38" height="88"/>
      <polygon points="96,48 115,30 134,48"/>
      <rect x="108" y="100" width="14" height="36" fill="#A6843D"/>
    </g>
    <g>
      <rect x="146" y="36" width="70" height="100" fill="#1E5C40"/>
      <rect x="160" y="96" width="20" height="40" fill="#F7F3EA"/>
      <rect x="186" y="52" width="18" height="14" fill="#E7D7A8"/>
      <path d="M142 136v-22h78v22" fill="none" stroke="#1A1714" stroke-width="2.2"/>
      <path d="M154 114v22M170 114v22M186 114v22M202 114v22" stroke="#1A1714" stroke-width="1.6"/>
    </g>
    <g fill="#1A1714">
      <rect x="228" y="70" width="26" height="66"/>
      <rect x="234" y="82" width="12" height="16" fill="#F7F3EA"/>
      <rect x="246" y="28" width="2.5" height="52"/>
      <path d="M248.5 36h18M248.5 44h12" stroke="#1A1714" stroke-width="1.4"/>
      <rect x="262" y="84" width="32" height="52"/>
      <rect x="270" y="96" width="16" height="18" fill="#F7F3EA"/>
      <rect x="302" y="52" width="38" height="84" fill="#6E6558"/>
      <rect x="314" y="102" width="14" height="32" fill="#1A1714"/>
    </g>
    <text x="181" y="162" text-anchor="middle" fill="#1E5C40" font-family="Outfit, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">MCCOY</text>
  </svg>

  <section class="visit">
    <div class="meta"><span>Stockyard · this visit</span><span>McCoy</span></div>
    <p>He wants the hay. Forty dollars for the stack, or a tenth of the pens.</p>
    <div class="choices">
      <button type="button">Sell the stack <b>$40</b></button>
      <button type="button">Take a tenth</button>
      <button type="button" class="ghost">Keep it</button>
    </div>
  </section>

  <div class="doors">
    <button type="button"><span>Store</span><small>Pruitt · the tab</small></button>
    <button type="button"><span>Telegraph</span><small>$1 a wire</small></button>
    <button type="button"><span>Land office</span><small>The claim clock</small></button>
    <button type="button"><span>Saloon</span><small>Bond talk</small></button>
    <button type="button"><span>Paper</span><small>You already take it</small></button>
    <button type="button" class="shut" disabled><span>Banker</span><small>Won’t see you yet</small></button>
  </div>

  <p class="after">Two visits after this one.</p>
  <footer class="ledger">
    <div><b>41.50</b><span>Cash</span></div>
    <div class="debt"><b>28</b><span>Tab · 3% mo.</span></div>
    <div><b>¾</b><span>Cellar</span></div>
    <div><b>3</b><span>Visits</span></div>
  </footer>
</div>
</x-dc>
<style>
  .phone { width: 390px; height: 844px; overflow: hidden; background: #E4DCCB; color: #1A1714; font-family: Outfit, sans-serif; box-sizing: border-box; padding: 22px 22px 0; display: flex; flex-direction: column; }
  .top, .title-row, .meta { display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
  .count { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 500; color: #6E6558; }
  .kicker { margin: 18px 0 0; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #6E6558; }
  h1 { margin: 2px 0 0; font-family: Fraunces, Georgia, serif; font-weight: 560; font-size: 36px; letter-spacing: -0.03em; line-height: 1.05; }
  .pips { display: flex; gap: 6px; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: #1E5C40; display: block; }
  .street { width: 100%; height: 148px; margin-top: 6px; display: block; }
  .after { margin: auto 0 0; font-size: 13px; color: #6E6558; }
  .visit { margin-top: 4px; background: #F7F3EA; padding: 12px 14px 14px; }
  .meta { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #1E5C40; }
  .visit p { margin: 8px 0 0; font-family: Fraunces, Georgia, serif; font-weight: 560; font-size: 18px; line-height: 1.3; letter-spacing: -0.02em; }
  .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .choices button, .doors button { font-family: Outfit, sans-serif; text-align: left; border: 0; background: #1A1714; color: #F7F3EA; min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
  .choices b { font-family: Fraunces, Georgia, serif; font-weight: 560; color: #E4DCCB; }
  .choices .ghost { background: transparent; color: #1A1714; box-shadow: inset 0 0 0 1.5px #1A1714; }
  .doors { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .doors button { background: transparent; color: #1A1714; box-shadow: inset 0 0 0 1px #C9BFAB; min-height: 48px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; }
  .doors small { font-size: 11px; color: #6E6558; font-weight: 400; }
  .doors .shut { color: #8A8172; }
  .doors .shut small { color: #8E3B32; }
  .ledger { margin-top: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border-top: 1px solid #C9BFAB; padding: 12px 0 18px; }
  .ledger b { display: block; font-family: Fraunces, Georgia, serif; font-weight: 560; font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .ledger span { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #6E6558; }
  .debt b, .debt span { color: #8E3B32; }
</style>
</body>
</html>
