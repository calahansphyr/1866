<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500;600&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>html, body { margin: 0; background: #6B8450; } x-dc { display: block; }</style>
</helmet>
<div class="phone">
  <header class="top">
    <div class="brand">
      <span>Hollis</span>
      <span class="dim">Spring 1867 · 5 / 20</span>
    </div>
    <div class="pips" aria-label="Three visits, one being spent"><i class="spent"></i><i></i><i></i></div>
  </header>

  <div class="map">
    <svg viewBox="0 0 390 500" width="390" height="500" aria-hidden="true">
      <rect width="390" height="500" fill="#6B8450"/>
      <ellipse cx="70" cy="40" rx="50" ry="18" fill="#62804A"/>
      <ellipse cx="300" cy="70" rx="70" ry="22" fill="#62804A"/>
      <ellipse cx="40" cy="260" rx="40" ry="16" fill="#749158"/>

      <path d="M0 168 h390" stroke="#C6AE7A" stroke-width="34"/>
      <path d="M118 168 v150" stroke="#C6AE7A" stroke-width="26"/>
      <path d="M118 318 h176" stroke="#C6AE7A" stroke-width="26"/>
      <path d="M0 168 h390 M118 168 v150 M118 318 h176" stroke="#E4D3A4" stroke-width="2" stroke-dasharray="2 10" opacity=".7"/>
      <path d="M100 400 L118 318 L214 318" fill="none" stroke="#F4EFE4" stroke-width="2" stroke-dasharray="4 6" opacity=".85"/>

      <g class="bldg">
        <rect x="18" y="62" width="72" height="58" fill="#8D5A3A"/>
        <rect x="18" y="112" width="72" height="8" fill="#5C3A24"/>
        <rect x="46" y="112" width="16" height="8" fill="#E7D7A8"/>
        <text x="54" y="146" text-anchor="middle">Land office</text>
      </g>
      <g class="bldg">
        <rect x="108" y="48" width="84" height="68" fill="#8D5A3A"/>
        <rect x="108" y="108" width="84" height="8" fill="#5C3A24"/>
        <rect x="142" y="108" width="18" height="8" fill="#E7D7A8"/>
        <text x="150" y="140" text-anchor="middle">Store</text>
      </g>
      <g class="bldg">
        <rect x="302" y="58" width="70" height="58" fill="#7A4632"/>
        <rect x="302" y="108" width="70" height="8" fill="#5C3A24"/>
        <rect x="328" y="108" width="16" height="8" fill="#A6843D"/>
        <text x="337" y="140" text-anchor="middle">Saloon</text>
      </g>

      <g class="bldg">
        <rect x="18" y="196" width="64" height="52" fill="#8D5A3A"/>
        <rect x="18" y="240" width="64" height="8" fill="#5C3A24"/>
        <rect x="70" y="188" width="3" height="36" fill="#3E2A1A"/>
        <path d="M73 196 h16 M73 204 h10" stroke="#3E2A1A" stroke-width="1.4"/>
        <text x="50" y="268" text-anchor="middle">Telegraph</text>
      </g>
      <g class="bldg shut">
        <rect x="168" y="196" width="78" height="60" fill="#8A8478"/>
        <rect x="168" y="248" width="78" height="8" fill="#5E5A54"/>
        <rect x="198" y="248" width="16" height="8" fill="#3E3C38"/>
        <text x="207" y="284" text-anchor="middle">Banker</text>
      </g>

      <g class="claim">
        <rect x="16" y="330" width="150" height="154" fill="#5F7A45" stroke="#3E4A2E" stroke-width="2" stroke-dasharray="4 3"/>
        <rect x="32" y="348" width="46" height="40" fill="#6B5344"/>
        <rect x="32" y="382" width="46" height="6" fill="#3E2A1A"/>
        <path d="M32 368 h46" stroke="#3E2A1A" stroke-width="1.2"/>
        <ellipse cx="112" cy="372" rx="22" ry="12" fill="#C6A15A"/>
        <ellipse cx="112" cy="366" rx="14" ry="8" fill="#E0BC6A"/>
        <g stroke="#3E4A2E" stroke-width="1.4">
          <path d="M36 410 h70 M36 418 h70 M36 426 h70"/>
        </g>
        <text x="91" y="468" text-anchor="middle">Your claim</text>
      </g>

      <g class="yard">
        <rect x="214" y="292" width="160" height="188" fill="#1F6B45"/>
        <rect x="214" y="472" width="160" height="8" fill="#144A30"/>
        <g fill="none" stroke="#E7D7A8" stroke-width="1.6">
          <rect x="230" y="312" width="36" height="28"/>
          <rect x="274" y="312" width="36" height="28"/>
          <rect x="318" y="312" width="40" height="28"/>
          <rect x="230" y="348" width="36" height="28"/>
          <rect x="274" y="348" width="36" height="28"/>
          <rect x="318" y="348" width="40" height="28"/>
        </g>
        <circle cx="248" cy="326" r="3" fill="#E7D7A8"/>
        <circle cx="292" cy="362" r="3" fill="#E7D7A8"/>
        <text x="294" y="410" text-anchor="middle" fill="#F4EFE4">McCoy’s pens</text>
        <text x="294" y="426" text-anchor="middle" fill="#E7D7A8" font-size="9">Sell half the hay</text>
      </g>
      <circle class="ring" cx="214" cy="318" r="14" fill="none" stroke="#F4EFE4" stroke-width="2"/>
    </svg>

    <div class="avatar" aria-hidden="true">
      <span class="tag">Hollis</span>
      <span class="shadow"></span>
      <span class="token">
        <span class="brim"></span>
        <span class="crown"></span>
      </span>
    </div>
  </div>

  <section class="dock">
    <div class="dock-kicker"><span>You sent Hollis</span><span>Visit 1 of 3</span></div>
    <ol>
      <li class="now">
        <i>1</i>
        <div>
          <b>Walking to the stockyard</b>
          <span class="bar" aria-hidden="true"><em></em></span>
        </div>
      </li>
      <li>
        <i>2</i>
        <div><b>Sell half the hay</b><small>$20 · keeps the rest for winter</small></div>
      </li>
    </ol>
    <p class="wont">The banker is not on the map for him yet. The tab is still $28.</p>
    <button type="button">Change the order</button>
  </section>
</div>
</x-dc>
<style>
  .phone { width: 390px; height: 844px; overflow: hidden; background: #6B8450; color: #1A1714; font-family: Outfit, sans-serif; box-sizing: border-box; display: flex; flex-direction: column; position: relative; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 8px; color: #F4EFE4; }
  .brand { display: flex; flex-direction: column; gap: 1px; }
  .brand span:first-child { font-family: Fraunces, Georgia, serif; font-weight: 560; font-size: 20px; letter-spacing: -0.03em; line-height: 1; }
  .dim { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .pips { display: flex; gap: 6px; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: #F4EFE4; display: block; }
  .pips .spent { background: transparent; box-shadow: inset 0 0 0 1.5px #F4EFE4; }
  .map { position: relative; height: 500px; flex: 0 0 500px; overflow: hidden; }
  .map svg { display: block; }
  .bldg text, .claim text { font-family: Outfit, sans-serif; font-size: 11px; font-weight: 600; fill: #1C2414; }
  .shut text { fill: #3A3834; }
  .avatar { position: absolute; left: 0; top: 0; width: 36px; height: 36px; offset-path: path("M 100 400 L 118 318 L 214 318"); offset-rotate: 0deg; offset-anchor: center; animation: walk 4.8s cubic-bezier(.45, .05, .55, .95) infinite; z-index: 2; }
  .tag { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); background: #F4EFE4; color: #1A1714; font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 2px; white-space: nowrap; }
  .shadow { position: absolute; left: 6px; bottom: 0; width: 24px; height: 8px; background: rgba(20, 28, 12, .35); border-radius: 50%; }
  .token { position: absolute; left: 5px; top: 6px; width: 26px; height: 26px; border-radius: 50%; background: #1A1714; box-shadow: inset 0 -6px 0 #C4A574; animation: bob 0.45s ease-in-out infinite; }
  .brim { position: absolute; left: -3px; top: 6px; width: 32px; height: 7px; background: #2A2118; border-radius: 4px; }
  .crown { position: absolute; left: 7px; top: -3px; width: 12px; height: 8px; background: #3E2A1A; border-radius: 6px 6px 1px 1px; }
  .ring { transform-origin: 214px 318px; animation: pulse 1.8s ease-out infinite; }
  @keyframes walk { 0% { offset-distance: 0%; } 82% { offset-distance: 100%; } 100% { offset-distance: 100%; } }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  @keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }
  .dock { margin-top: auto; background: #F4EFE4; color: #1A1714; border-radius: 18px 18px 0 0; padding: 14px 16px 18px; box-shadow: 0 -10px 24px rgba(20, 28, 12, .18); }
  .dock-kicker { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #6E6558; }
  ol { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li { display: flex; gap: 10px; align-items: flex-start; }
  li i { flex: 0 0 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 12px; font-weight: 600; background: #E7E1D4; color: #6E6558; }
  .now i { background: #1F6B45; color: #F4EFE4; }
  li b { display: block; font-family: Fraunces, Georgia, serif; font-weight: 560; font-size: 18px; letter-spacing: -0.02em; line-height: 1.15; }
  li small { display: block; margin-top: 2px; font-size: 12px; color: #6E6558; }
  .bar { display: block; margin-top: 6px; height: 3px; background: #E7E1D4; border-radius: 2px; overflow: hidden; }
  .bar em { display: block; height: 100%; width: 70%; background: #1F6B45; }
  .wont { margin: 10px 0 0; font-size: 13px; line-height: 1.35; color: #3A342C; }
  .dock button { margin-top: 12px; width: 100%; min-height: 44px; border: 0; background: transparent; box-shadow: inset 0 0 0 1.5px #1A1714; font-family: Outfit, sans-serif; font-size: 14px; font-weight: 500; color: #1A1714; }
  @media (prefers-reduced-motion: reduce) {
    .avatar { animation: none; offset-distance: 55%; }
    .body, .ring { animation: none; }
  }
</style>
</body>
</html>
