<x-dc>

<div style="width: 390px; height: 844px; overflow: hidden; background: #DCEBF5; color: #2B3A4E; font-family: 'Nunito', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; position: relative;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 54px 22px 0 22px;">
    <div style="font-family: 'Fredoka', 'Nunito', sans-serif; font-weight: 600; font-size: 20px;">Hollis Claim</div>
    <div style="font-size: 12px; font-weight: 700; color: #4A6FA5; background: #FFFFFF; padding: 6px 12px; border-radius: 999px;">Spring 1867 · 5/20</div>
  </div>

  <svg viewBox="0 0 390 430" width="390" height="430" style="display: block;" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="195" cy="250" rx="180" ry="96" fill="#C9DEEA" />

        <path d="M20 40 L 70 65 L 20 20 L -30 65 Z" fill="#E07A5F" /><path d="M20 20 L 70 65 L 70 55 L 20 10 Z" fill="#C9634A" />
        <rect x="-8" y="72" width="12" height="18" fill="#3D2E24" transform="skewY(-26)" />

      <g>
        <path d="M90 100 L 130 120 L 130 150 L 90 130 Z" fill="#C48A5A" /><path d="M90 100 L 60 115 L 60 145 L 90 130 Z" fill="#A8734A" /><path d="M90 100 L 130 120 L 95 92 L 60 115 Z" fill="#8A5A3A" />

    <g>
      <g transform="translate(70 96)"><circle cx="0" cy="0" r="18" fill="#FFFFFF" /><svg x="-10" y="-10" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B3A4E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-2 12H6z" /><path d="M9 8V6a3 3 0 0 1 6 0v2" /></svg><path d="M0 18 L -6 28 L 6 28 Z" fill="#FFFFFF" /></g>

  <div style="margin-top: auto; background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 18px 22px 26px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -8px 24px rgba(43,58,78,.08);">
    <div style="width: 40px; height: 4px; background: #DCEBF5; border-radius: 2px; align-self: center;"></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-family: 'Fredoka', 'Nunito', sans-serif; font-weight: 600; font-size: 21px;">McCoy wants your hay</div>
      <div style="font-size: 12px; font-weight: 700; color: #E07A5F;">This season only</div>
    </div>
    <div style="font-size: 14px; line-height: 1.5; color: #5A6B80;">He's building pens by the grade and says Texas herds come north in July. The saloon says a county bond vote is coming — "can't lose."</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #4A6FA5; color: #FFFFFF; border-radius: 14px; font-weight: 700; font-size: 14px;">Sell<span style="font-size: 12px; font-weight: 600; opacity: .85;">$40 now</span></div>
      <div style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #EAF1F7; border-radius: 14px; font-weight: 700; font-size: 14px;">Share<span style="font-size: 12px; font-weight: 600; color: #5A6B80;">1/10 of yard</span></div>
      <div style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #EAF1F7; border-radius: 14px; font-weight: 700; font-size: 14px;">Keep<span style="font-size: 12px; font-weight: 600; color: #5A6B80;">for winter</span></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #5A6B80; padding-top: 4px;">
      <span>Cash $41.50</span><span style="color: #E07A5F;">Tab $28</span><span>Cellar ¾</span><span>Visits 3</span>
    </div>
  </div>
</div>
