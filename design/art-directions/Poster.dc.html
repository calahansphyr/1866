<body>
<x-dc>
<helmet>

    a { color: #E8743B; } a:hover { color: #1F2A44; }

</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F3E7CF; color: #1F2A44; font-family: 'Work Sans', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; position: relative;">

    <path d="M0 280 Q 120 240, 240 275 T 390 262 L 390 400 L 0 400 Z" fill="#1F2A44" />
    <g fill="#1F2A44">
      <rect x="40" y="228" width="6" height="40" /><rect x="90" y="222" width="6" height="46" /><rect x="140" y="226" width="6" height="42" /><rect x="190" y="220" width="6" height="48" /><rect x="240" y="224" width="6" height="44" /><rect x="290" y="218" width="6" height="50" />
      <rect x="40" y="236" width="256" height="4" /><rect x="40" y="250" width="256" height="4" />

    <text x="24" y="330" fill="#F3E7CF" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="64" letter-spacing=".02em">ABILENE</text>
    <text x="26" y="362" fill="#E9B44C" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="700" font-size="22" letter-spacing=".18em">SPRING 1867</text>
  </svg>

  <div style="display: flex; gap: 3px; padding: 0 24px; margin-top: 14px;">
    <div style="flex: 1; height: 8px; background: #1F2A44;"></div><div style="flex: 1; height: 8px; background: #1F2A44;"></div><div style="flex: 1; height: 8px; background: #1F2A44;"></div><div style="flex: 1; height: 8px; background: #1F2A44;"></div><div style="flex: 1; height: 8px; background: #E8743B;"></div>
    <div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div><div style="flex: 1; height: 8px; background: #D9C9A8;"></div>
  </div>
  <div style="display: flex; justify-content: space-between; padding: 6px 24px 0 24px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #6B6A66;">
    <span>Season 5 of 20</span><span>Prove up: 1871</span>
  </div>

  <div style="padding: 18px 24px 0 24px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
    <div style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 30px; line-height: 1; text-transform: uppercase;">McCoy wants your hay.</div>
    <div style="font-size: 14px; line-height: 1.45; color: #4A4E5A;">He bought every board in town and is building pens by the grade. Texas herds by July, he says. $40 for all of it, today.</div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
      <div style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #1F2A44; color: #F3E7CF; font-weight: 600; font-size: 15px;"><span>Sell the hay</span><span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 22px; color: #E9B44C;">$40</span></div>
      <div style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 2px solid #1F2A44; font-weight: 600; font-size: 15px;"><span>Take a share of the yard</span><span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 22px; color: #E8743B;">1/10</span></div>
      <div style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 2px solid #D9C9A8; font-weight: 600; font-size: 15px; color: #6B6A66;"><span>Keep it for winter</span><span style="font-size: 12px; text-transform: uppercase; letter-spacing: .1em;">Pass</span></div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid #1F2A44; padding: 12px 16px 24px 16px; gap: 6px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4" /></svg><span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 700; font-size: 17px;">41.50</span><span style="font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: #6B6A66;">Cash</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8743B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12H4z" /><path d="M8 7V5h8v2M4 12h16" /></svg><span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 700; font-size: 17px; color: #E8743B;">28.00</span><span style="font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: #6B6A66;">Tab</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10l7-6 7 6v10H5z" /><path d="M9 20v-6h6v6" /></svg><span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 700; font-size: 17px;">75%</span><span style="font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: #6B6A66;">Cellar</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z" /></svg><span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 700; font-size: 17px;">3</span><span style="font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: #6B6A66;">Visits</span></div>
  </div>
</div>
