<title>1866: Prove Up</title>
<meta name="theme-color" content="#F6EEDB">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
  /* Layout: the town fills the screen; anything you read is ink on paper laid over it. One deliberate look in both themes. */
  :root {
    --sky: #BFE0F0;
    --paper: #F6EEDB;
    --paper-hi: #FBF5E6;
    --ink: #2A2420;
    --muted: #5A4A3A;
    --rule: #D9C9A8;
    --red: #A8321F;
    --accent: #8A3A2A;
    --green: #3E6B2E;
    --gold: #A6761C;
    --blue: #2F5E9E;
    --night: #3A3128;
    --display: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
    --body: 'Spectral', 'Iowan Old Style', Georgia, serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--sky); color: var(--ink); font: 16px/1.5 var(--body); }
  ::selection { background: #E8C98A; color: var(--ink); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* Header: who, when, cash, tab, cellar jars, daylight */
  #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 5; background: var(--paper); border-bottom: 2px solid var(--ink);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px; display: flex; flex-direction: column; gap: 6px;
    box-shadow: 0 4px 12px rgba(42,36,32,.14); }
  #hud .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; max-width: 720px; width: 100%; margin: 0 auto; }
  #family { font-family: var(--display); font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #when { font-style: italic; font-size: 14px; white-space: nowrap; }
  #stats { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  #stats .s { display: flex; align-items: center; gap: 5px; }
  #tab.owed { color: var(--red); }
  #jars { display: flex; gap: 4px; align-items: center; }
  /* Daylight: a sun travels a thin bar from dawn to dusk */
  #sun { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #sunbar { position: relative; width: 52px; height: 8px; border: 1.5px solid var(--ink); border-radius: 6px; background: linear-gradient(90deg, #F2C98A, #F6E6A8 30%, #F6E6A8 70%, #E8946A 90%, #5A5A8A); overflow: hidden; }
  #sunleft { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(-45deg, rgba(42,36,32,.55) 0 2px, rgba(42,36,32,.25) 2px 4px); }
  #sun.late { color: var(--red); }
  #hud .tools { display: flex; gap: 6px; }
  .iconbtn { width: 36px; height: 36px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--paper-hi); display: grid; place-items: center; padding: 0; }

  /* The prompt at the bottom of the town */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-direction: column; gap: 8px; align-items: stretch; pointer-events: none; }
  #dock > * { pointer-events: auto; max-width: 560px; width: 100%; margin: 0 auto; }
  #hint { background: rgba(42,36,32,.86); color: var(--paper); border-radius: 10px; padding: 7px 12px; font-size: 14px; text-align: center; }
  .bigbtn { min-height: 52px; border: 0; border-radius: 12px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 16px; padding: 10px 16px; }
  .bigbtn.light { background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); }
  .bigbtn:disabled { opacity: .5; cursor: default; }
  #dock .pair { display: flex; gap: 8px; }
  #dock .pair > * { flex: 1; }

  /* Paper sheets */
  #veil { position: fixed; inset: 0; z-index: 8; background: rgba(42,36,32,.35); }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 86%; overflow-y: auto;
    background: var(--paper); border-top: 2px solid var(--ink); padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 22px); }
  #sheet .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  #sheet.full { top: 0; max-height: none; background: var(--night); border: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 20px); }
  #sheet.full .in { gap: 14px; }
  .speaker { display: flex; gap: 12px; align-items: flex-start; }
  .portrait { width: 60px; height: 60px; flex-shrink: 0; border: 2px solid var(--ink); border-radius: 50%; overflow: hidden; background: #E8DCC0; }
  .portrait svg { width: 100%; height: 100%; }
  .who { font-family: var(--display); font-size: 19px; line-height: 1.1; }
  .role { font-size: 13px; font-style: italic; color: var(--muted); }
  .say { font-size: 16px; line-height: 1.5; margin-top: 4px; }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 48px; padding: 10px 14px; background: var(--paper-hi);
    border: 1.5px solid var(--ink); border-radius: 12px; font-size: 16px; }
  .choice:hover:not(:disabled) { background: #F0E4C8; }
  .choice:disabled { opacity: .45; cursor: default; }
  .choice .cost { margin-left: auto; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .choice svg { flex-shrink: 0; }
  .walk { background: none; border: 0; font-style: italic; color: var(--muted); text-align: left; padding: 8px 14px; min-height: 44px; font-size: 15px; }
  .note { font-size: 13px; font-style: italic; color: var(--muted); }
  .ledger { border: 1.5px solid var(--ink); background: var(--paper-hi); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
  .ledger .l { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
  .ledger .l b { white-space: nowrap; }
  .ledger .neg { color: var(--red); }
  .ledger .pos { color: var(--green); }
  .ledger .tot { border-top: 1px solid var(--rule); margin-top: 4px; padding-top: 6px; font-weight: 700; }
  .h { font-family: var(--display); font-size: 22px; line-height: 1.15; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 44px; height: 44px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--paper-hi); font-size: 20px; }
  .stepper output { min-width: 4ch; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

  /* Letters */
  .letter { background: var(--paper-hi); border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 20px 18px 18px 64px; position: relative; display: flex; flex-direction: column; gap: 12px; }
  .letter::before { content: ""; position: absolute; left: 48px; top: 0; bottom: 0; width: 1.5px; background: #E0A99C; }
  .letter.plain { padding-left: 18px; }
  .letter.plain::before { display: none; }
  .letter .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .letter .dear { font-family: var(--display); font-size: 20px; }
  .letter .date { font-style: italic; font-size: 13px; }
  .letter p { margin: 0; font-style: italic; font-size: 15px; line-height: 1.5; }
  .line { position: relative; }
  .stamp { position: absolute; left: -60px; top: 2px; width: 52px; text-align: center; font-family: var(--display); font-size: 10px; border: 2px solid; border-radius: 4px; padding: 1px 0; transform: rotate(-7deg); }
  .stamp.Sound { color: var(--green); } .stamp.Lucky { color: var(--gold); } .stamp.Unlucky { color: var(--blue); } .stamp.Exposed { color: var(--red); }
  .why { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .winters { border: 1.5px solid var(--ink); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin-left: -12px; }
  .winters .t { font-family: var(--display); font-size: 13px; }
  .winters .grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; justify-items: center; }
  .jar { width: 16px; height: 22px; border-radius: 3px; border: 1.5px solid var(--ink); }
  .jar.full { background: #D99A4E; }
  .jar.empty { background: repeating-linear-gradient(-45deg, var(--paper-hi) 0 3px, #E0A99C 3px 5px); }
  .jar.mine { outline: 2px solid var(--accent); outline-offset: 3px; }
  .sign { font-family: var(--display); font-size: 17px; text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .sign .portrait { width: 36px; height: 36px; border-width: 1.5px; }
  .pips { display: grid; grid-template-columns: 116px 1fr; row-gap: 7px; align-items: center; font-size: 15px; }
  .pips .p { display: flex; gap: 5px; }
  .pips i { width: 22px; height: 12px; border-radius: 3px; border: 1.5px solid var(--ink); display: block; }
  .pips i.on { background: #6B8F5E; }
  .opens { display: flex; flex-direction: column; gap: 5px; font-size: 15px; }
  .opens div { display: flex; gap: 8px; align-items: flex-start; }

  /* Almanac */
  .alm h3 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; line-height: 1.1; }
  .alm .k { font-family: var(--display); font-size: 14px; color: var(--accent); }
  .alm p { margin: 2px 0 0; font-size: 15px; line-height: 1.5; }
  .alm .entry { display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--rule); padding-bottom: 14px; }
  .alm .entry:last-child { border-bottom: 0; }
  .alm .yours { border: 1.5px solid var(--ink); padding: 10px 12px; background: var(--paper-hi); }

  /* Character creation */
  .swatches { display: flex; justify-content: space-between; gap: 6px; }
  .sw { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--ink); overflow: hidden; background: #EFE4CC; padding: 0; }
  .sw svg { width: 100%; height: 100%; }
  .sw.hair { border-radius: 16px 16px 5px 5px; width: 52px; height: 32px; }
  .sw[aria-pressed="true"] { outline: 2.5px solid var(--accent); outline-offset: 3px; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field label, .lbl { font-size: 12px; font-style: italic; color: var(--muted); }
  .field input { border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; font-family: var(--display); font-size: 20px; padding: 2px 0; width: 100%; color: var(--ink); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hero { display: flex; justify-content: center; align-items: flex-end; height: 200px; }
  .hero svg { width: 120px; height: 200px; }

  #banner { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 104px); transform: translateX(-50%); z-index: 6; width: min(420px, calc(100% - 32px));
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 18px rgba(42,36,32,.22); display: flex; flex-direction: column; gap: 2px; }
  #banner .d { font-family: var(--display); font-size: 18px; line-height: 1.15; }
  #banner .e { font-size: 14px; line-height: 1.4; }
  #fadeNote { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; color: var(--paper); font-family: var(--display); font-size: 22px; pointer-events: none; text-align: center; padding: 0 24px; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); transform: translateX(-50%); z-index: 12; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
  .night { color: var(--paper); display: flex; flex-direction: column; gap: 10px; margin-top: 12vh; }
  .night .moon { display: flex; justify-content: center; }
  .night .h { color: var(--paper); text-align: center; }
  .night .sub { text-align: center; font-style: italic; color: #D9C9A8; font-size: 14px; }
  .night .ledger { background: #3E352C; border-color: #8A7A62; color: var(--paper); }
  .night .ledger .neg { color: #F2A08A; } .night .ledger .pos { color: #A8D88A; }
  .tomorrow { border-left: 3px solid #E6C77A; padding: 4px 0 4px 12px; font-size: 15px; }
  .timecost { font-size: 13px; color: var(--muted); font-style: italic; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<canvas id="scene" aria-label="The town of Abilene, Kansas, and your claim south of the creek"></canvas>

<header id="hud" hidden>
  <div class="row">
    <div id="family">The Hollis Family</div>
    <div id="when">Spring 1866</div>
  </div>
  <div class="row">
    <div id="stats">
      <div class="s" title="Cash"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="#E8B84A" stroke="#2A2420" stroke-width="1.4"/><circle cx="8" cy="8" r="3.5" fill="none" stroke="#B5862A" stroke-width="1.2"/></svg><span id="cash">$0</span></div>
      <div class="s" id="tab" title="Pruitt's book"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="10" height="12" fill="#F6EEDB" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="1" width="10" height="12" fill="#F6EEDB" stroke="currentColor" stroke-width="1.4"/><path d="M6 5 H12 M6 8 H12 M6 11 H10" stroke="currentColor" stroke-width="1.2"/></svg><span id="tabv">Tab $0</span></div>
      <div id="jars" title="Cellar jars"></div>
    </div>
    <div id="sun" title="Daylight left today"><div id="sunbar"><div id="sunleft"></div></div><span id="clock">6:00</span></div>
    <div class="tools">
      <button class="iconbtn" id="almBtn" aria-label="Open the Almanac"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2420" stroke-width="2" stroke-linejoin="round"><path d="M5 3 H17 A2 2 0 0 1 19 5 V21 H7 A2 2 0 0 1 5 19 Z"/><path d="M9 8 H15 M9 12 H13"/></svg></button>
    </div>
  </div>
</header>

<div id="dock" hidden>
  <div id="hint">Tap the ground to walk, or hold and drag.</div>
  <button class="bigbtn" id="act" hidden>Go in</button>
</div>
<div id="banner" hidden></div>
<div id="fadeNote" aria-live="polite"></div>

<div id="veil" hidden></div>
<section id="sheet" role="dialog" aria-modal="true" hidden><div class="in" id="sheetIn"></div></section>
<div id="toast" role="status" hidden></div>

<script type="module" src="./main.js"></script>
